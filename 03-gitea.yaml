# 03. gitea — base + Traefik + Gitea + act_runner + wharfline
#   인벤토리의 [gitea] 그룹에 적용됩니다.
#
# 실행:
#   ansible-playbook -i inventory/all.ini.vault 03-gitea.yaml --vault-password-file vault_password.txt
#   일부만: --tags traefik | gitea | wharfline   (base 건너뛰기: --skip-tags common,user,docker)
#
# 필수 변수 (vault): gitea_domain, gitea_db_password, gitea_admin_email, gitea_admin_password,
#                    wharfline_domain, wharfline_postgres_password, wharfline_owner_email, wharfline_owner_password
# HTTPS: traefik_acme_email 을 지정하면 Let's Encrypt 인증서 자동 발급/갱신 (도메인 DNS 가 이 서버를 가리켜야 함)
- import_playbook: 01-base.yaml
  vars:
    base_hosts: gitea

- name: "03 gitea | Gitea + act_runner + wharfline + Traefik"
  hosts: gitea
  become: true

  vars:
    site_scheme: "{{ 'https' if (traefik_acme_email | default('')) | length > 0 else 'http' }}"
    # 서버 안 컨테이너(작업 컨테이너 포함)가 이 도메인으로 접속하면 바로 Traefik 으로
    traefik_site_domains: ["{{ gitea_domain }}", "{{ wharfline_domain }}"]
    traefik_extra_networks: "{{ [gitea_runner_network | default('gitea_actions')] if gitea_runner_enabled | default(true) | bool else [] }}"
    # wharfline 이 .env 업로드를 확인할 Gitea: 도메인 그대로 (위 alias 로 서버 안에서 Traefik → Gitea)
    wharfline_gitea_url: "{{ site_scheme }}://{{ gitea_domain }}"

  roles:
    - { role: traefik,   tags: [traefik] }
    - { role: gitea,     tags: [gitea] }
    - { role: wharfline, tags: [wharfline] }
