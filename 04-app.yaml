# 04. app — base + Traefik + 배포 디렉터리   (CI / wharfline 이 배포하는 대상 서버)
#   인벤토리의 [app] 그룹에 적용됩니다.
#   앞단 프록시로 Traefik 을 씁니다: 컨테이너 라벨로 라우팅되므로 docker rollout 무중단 배포가 됩니다.
#   (02/03 처럼 호스트 nginx 가 80/443 을 쓰는 서버와 같은 서버에 두지 마세요)
#
# 실행:
#   ansible-playbook -i inventory/all.ini.vault 04-app.yaml --vault-password-file vault_password.txt
#
# 앱 배포 방법: README 의 "04-app" 참고 (/srv/apps/<앱>/docker-compose.yml + traefik 라벨)
- import_playbook: 01-base.yaml
  vars:
    base_hosts: app

- name: "04 app | Traefik + app host"
  hosts: app
  become: true

  roles:
    - { role: traefik,  tags: [traefik] }
    - { role: app_host, tags: [app] }
