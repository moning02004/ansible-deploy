# 04. gitlab — base + Traefik + GitLab CE + gitlab-runner + wharfline   (03-gitea 의 GitLab 버전)
#   인벤토리의 [gitlab] 그룹에 적용됩니다. 메모리 4GB 이상 권장 (8GB 이상이면 gitlab_low_memory: false)
#
# 실행:
#   ansible-playbook -i inventory/all.ini.vault 04-gitlab.yaml --vault-password-file vault_password.txt
#   일부만: --tags traefik | gitlab | wharfline
#
# 필수 변수 (vault): gitlab_domain, gitlab_root_password,
#                    wharfline_domain, wharfline_postgres_password, wharfline_owner_email, wharfline_owner_password
- import_playbook: 01-base.yaml
  vars:
    base_hosts: gitlab

- name: "04 gitlab | GitLab CE + gitlab-runner + wharfline + Traefik"
  hosts: gitlab
  become: true

  vars:
    site_scheme: "{{ 'https' if (traefik_acme_email | default('')) | length > 0 else 'http' }}"
    # 서버 안 컨테이너(CI 작업 컨테이너 포함)가 이 도메인으로 접속하면 바로 Traefik 으로
    traefik_site_domains: ["{{ gitlab_domain }}", "{{ wharfline_domain }}"]
    traefik_extra_networks: "{{ [gitlab_runner_network | default('gitlab_jobs')] if gitlab_runner_enabled | default(true) | bool else [] }}"

  roles:
    - { role: traefik,   tags: [traefik] }
    - { role: gitlab,    tags: [gitlab] }
    - { role: wharfline, tags: [wharfline] }
