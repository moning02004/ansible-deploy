# 05. app — base + Traefik + 배포 디렉터리   (CI / wharfline 이 배포하는 대상 서버)
#   인벤토리의 [app] 그룹에 적용됩니다.
#   앞단 프록시로 Traefik 을 씁니다: 컨테이너 라벨로 라우팅되므로 docker rollout 무중단 배포가 됩니다.
#   03/04/07 도 같은 Traefik role 을 쓰므로 한 서버에 함께 둘 수 있습니다 (02-kubernetes 와는 80/443 이 겹침)
#
# 실행:
#   ansible-playbook -i inventory/all.ini.vault 05-app.yaml --vault-password-file vault_password.txt
#
# 앱 배포 방법: README 의 "05-app" 참고 (/srv/apps/<앱>/docker-compose.yml + traefik 라벨)
- import_playbook: 01-base.yaml
  vars:
    base_hosts: app

- name: "05 app | Traefik + app host"
  hosts: app
  become: true

  vars:
    # 서버 안에서도 예시 앱 도메인이 Traefik 으로 (내 앱 도메인은 traefik_domain_aliases 에)
    traefik_site_domains: "{{ [app_example_domain] if app_example_enabled | default(false) | bool else [] }}"
    traefik_extra_networks: []

  roles:
    - { role: traefik,  tags: [traefik] }
    - { role: app_host, tags: [app] }
