# 07. monitoring — Prometheus + Grafana, 그리고 모든 서버에 node-exporter / cAdvisor
#   [monitoring] 그룹: Prometheus + Grafana (+ Traefik 으로 grafana_domain 노출)
#   monitoring_targets 그룹 (기본 all): node-exporter(9100), cAdvisor(9280) — 모니터링 서버 IP 에서만 접근 허용
#
# 실행:
#   ansible-playbook -i inventory/all.ini.vault 07-monitoring.yaml --vault-password-file vault_password.txt
#   에이전트만 다시: --tags agent      서버만: --tags monitoring
#
# 필수 변수 (vault): grafana_domain, grafana_admin_password
- import_playbook: 01-base.yaml
  vars:
    base_hosts: "{{ monitoring_targets | default('all') }}:monitoring"

- name: "07 monitoring | exporters on every target"
  hosts: "{{ monitoring_targets | default('all') }}"
  become: true
  roles:
    - { role: monitoring_agent, tags: [agent] }

- name: "07 monitoring | Prometheus + Grafana"
  hosts: monitoring
  become: true
  vars:
    site_scheme: "{{ 'https' if (traefik_acme_email | default('')) | length > 0 else 'http' }}"
    # Grafana 는 host 네트워크라 Traefik 파일 라우트로 연결
    traefik_file_routes:
      - name: grafana
        host: "{{ grafana_domain }}"
        url: "http://host.docker.internal:{{ grafana_port | default(3001) }}"
  roles:
    - { role: traefik,    tags: [traefik] }
    - { role: monitoring, tags: [monitoring] }
