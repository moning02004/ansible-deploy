# 09. backup — 서버에 있는 서비스를 자동 감지해서 백업
#   대상: postgres(05), gitea(02), wharfline(02/03), gitlab(03), rabbitmq/redis(08), /opt/*/ 설정 파일
#   위치: /var/backups/orca/<시각>/  (latest 링크, backup_keep_days 보관)
#   restic: backup_restic_repository 를 지정하면 외부 저장소(S3, SFTP, NAS 등)로도 전송
#
# 실행:
#   ansible-playbook ... 09-backup.yaml                 # 매일 자동 백업 스케줄 설치 (systemd timer)
#   ansible-playbook ... 09-backup.yaml --tags now      # 지금 즉시 백업
#   ansible-playbook ... 09-backup.yaml --tags now -e backup_fetch=true   # + 컨트롤러로 가져오기
#   특정 서버만: --limit server1
- name: "09 backup"
  hosts: "{{ backup_hosts | default('all') }}"
  become: true

  roles:
    - role: backup
