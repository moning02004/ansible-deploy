# 13. user — 사람 계정 추가 / 비밀번호 변경 / sudo 권한 변경
#   모든 서버에 적용 (단독 실행용). 일부 서버만: --limit server1
#   실행하면 계정, 비밀번호, sudo 여부를 묻습니다. -e 로 넘긴 값은 묻지 않습니다.
#
# 실행:
#   ansible-playbook -i inventory/all.ini.vault 13-user.yaml --vault-password-file vault_password.txt
#   SSH 키도 등록: -e '{"account_ssh_keys":["ssh-ed25519 AAAA... me@laptop"]}'
#
# 같은 계정으로 다시 실행하면 비밀번호와 sudo 여부를 입력한 값으로 바꿉니다.
# sudo 는 sudo 그룹(비밀번호 입력 필요)으로 줍니다. 비밀번호 없는 sudo 는 01-base 의 deploy 유저만.
# 08 에서 AllowUsers 를 켰다면 새 계정을 거기에 더합니다 (08 을 다시 돌릴 때를 위해 security_ssh_allow_users 에도 넣어 두세요)
#
# Wharfline 에서 실행: 계정 이름 / 비밀번호 / sudo 는 입력칸으로 나옵니다.
#   become_password: 접속 계정의 sudo 비밀번호. 접속 계정이 비밀번호 없이 sudo 되면 비워 둡니다.
#   account_ssh_keys: 등록할 SSH 공개키, 한 줄에 하나씩. 없으면 비워 둡니다.
- name: "13 user | 계정 추가"
  hosts: "{{ account_hosts | default('all') }}"
  become: true
  # facts 를 모으는 것도 sudo 로 하므로, sudo 비밀번호를 먼저 정한 뒤 role 이 필요한 것만 읽습니다
  gather_facts: false

  vars_prompt:
    - name: account_name
      prompt: 계정 이름
      private: false
    - name: account_password
      prompt: 비밀번호 (8자 이상)
      private: true
      confirm: true
    - name: account_sudo
      prompt: sudo 권한 (yes/no)
      private: false
      default: "no"

  pre_tasks:
    - name: Use the given sudo password
      ansible.builtin.set_fact:
        ansible_become_password: "{{ become_password }}"
      when: become_password | default('') | length > 0
      no_log: true
      tags: [user]

    # role 의 비밀번호 작업은 no_log 라 실패 이유가 가려지므로, sudo 가 되는지 먼저 확인 (안 되면 "Missing sudo password")
    - name: Check sudo
      ansible.builtin.command: "true"
      changed_when: false
      check_mode: false
      tags: [user]

  roles:
    - { role: account, tags: [user] }
