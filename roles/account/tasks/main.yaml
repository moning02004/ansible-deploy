- name: Validate input
  ansible.builtin.assert:
    that:
      - account_name is match('^[a-z_][a-z0-9_-]{0,31}$')
      - account_name not in ['root', deploy_user | default('manager')]
      - account_password | length >= 8
    fail_msg: >-
      계정은 영문 소문자로 시작하는 소문자·숫자·_·- (32자 이하), root 와 deploy 유저({{ deploy_user | default('manager') }})는 안 됩니다.
      비밀번호는 8자 이상이어야 합니다.
    quiet: true

# 비밀번호 해시의 salt 를 매번 새로 만들면 실행할 때마다 changed 가 되므로 기존 salt 를 재사용
- name: Read existing password hash
  ansible.builtin.getent:
    database: shadow
    key: "{{ account_name }}"
    fail_key: false
  no_log: true

# 대상 서버의 openssl 로 해시 (컨트롤러에 passlib 불필요). 비밀번호는 stdin 으로만 전달
- name: Hash password
  ansible.builtin.command:
    cmd: openssl passwd -6 -salt {{ salt }} -stdin
    stdin: "{{ account_password }}"
  vars:
    current: "{{ (ansible_facts.getent_shadow[account_name] | default(none) or [''])[0] }}"
    salt: >-
      {{ current.split('$')[2] if current is match('^\$6\$[./0-9A-Za-z]{1,16}\$')
         else lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=16') }}
  register: account_password_hash
  changed_when: false
  check_mode: false
  no_log: true

- name: Ensure user exists
  ansible.builtin.user:
    name: "{{ account_name }}"
    password: "{{ account_password_hash.stdout }}"
    update_password: always
    shell: "{{ account_shell }}"
    groups: "{{ ['sudo'] if account_sudo | bool else omit }}"
    append: true
    create_home: true
    state: present
  no_log: true

- name: Read sudo group members
  ansible.builtin.getent:
    database: group
    key: sudo

- name: Remove from sudo group
  ansible.builtin.command: gpasswd -d {{ account_name }} sudo
  when:
    - not account_sudo | bool
    - account_name in ansible_facts.getent_group.sudo[2].split(',')

- name: Register SSH public keys
  ansible.posix.authorized_key:
    user: "{{ account_name }}"
    key: "{{ item }}"
    state: present
  loop: "{{ account_ssh_keys }}"
  loop_control:
    label: "{{ item | truncate(40) }}"
