- name: Validate input
  ansible.builtin.assert:
    that:
      - account_name is match('^[a-z_][a-z0-9_-]{0,31}$')
      - account_name not in ['root', deploy_user | default('manager')]
      - account_password | length >= 8
    fail_msg: >-
      계정은 영문 소문자로 시작하는 소문자·숫자·_·- (32자 이하), root 와 deploy 유저({{ deploy_user | default('manager') }})는 안 됩니다.
      비밀번호는 8자 이상이어야 합니다.
    quiet: true

# 비밀번호 해시의 salt 를 매번 새로 만들면 실행할 때마다 changed 가 되므로 기존 salt 를 재사용
- name: Read existing password hash
  ansible.builtin.getent:
    database: shadow
    key: "{{ account_name }}"
    fail_key: false
  no_log: true

# 대상 서버의 openssl 로 해시 (컨트롤러에 passlib 불필요). 비밀번호는 stdin 으로만 전달
- name: Hash password
  ansible.builtin.command:
    cmd: openssl passwd -6 -salt {{ salt }} -stdin
    stdin: "{{ account_password }}"
  vars:
    current: "{{ (ansible_facts.getent_shadow[account_name] | default(none) or [''])[0] }}"
    salt: >-
      {{ current.split('$')[2] if current is match('^\$6\$[./0-9A-Za-z]{1,16}\$')
         else lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=16') }}
  register: account_password_hash
  changed_when: false
  check_mode: false
  no_log: true

- name: Ensure user exists
  ansible.builtin.user:
    name: "{{ account_name }}"
    password: "{{ account_password_hash.stdout }}"
    update_password: always
    shell: "{{ account_shell }}"
    groups: "{{ ['sudo'] if account_sudo | bool else omit }}"
    append: true
    create_home: true
    state: present
  no_log: true

- name: Read sudo group members
  ansible.builtin.getent:
    database: group
    key: sudo

- name: Remove from sudo group
  ansible.builtin.command: gpasswd -d {{ account_name }} sudo
  when:
    - not account_sudo | bool
    - account_name in ansible_facts.getent_group.sudo[2].split(',')

# 목록이나 여러 줄 글 (Wharfline 입력칸은 글) 둘 다 받습니다
- name: Register SSH public keys
  ansible.posix.authorized_key:
    user: "{{ account_name }}"
    key: "{{ item }}"
    state: present
  loop: "{{ (account_ssh_keys.splitlines() if account_ssh_keys is string else account_ssh_keys) | map('trim') | select | list }}"
  loop_control:
    label: "{{ item | truncate(40) }}"

# 08 security 가 AllowUsers 를 썼다면 이 계정을 더해야 SSH 로 들어올 수 있음
- name: Check SSH hardening config (08 security)
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/00-hardening.conf
  register: account_hardening

- name: Allow SSH login (AllowUsers)
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config.d/00-hardening.conf
    regexp: '^(AllowUsers\b(?!.*\s{{ account_name }}(\s|$)).*)$'
    replace: '\1 {{ account_name }}'
  when: account_hardening.stat.exists
  notify: Reload ssh

- name: Read SSH login settings
  ansible.builtin.command: sshd -T
  register: account_sshd
  changed_when: false
  failed_when: false
  check_mode: false

- name: How to log in
  ansible.builtin.debug:
    msg: >-
      ssh {{ account_name }}@{{ ansible_host | default(inventory_hostname) }} -p {{ ansible_port | default(22) }}
      (홈: /home/{{ account_name }}) ·
      {{ '비밀번호로 로그인할 수 있어요' if 'passwordauthentication yes' in account_sshd.stdout | lower
         else '이 서버는 비밀번호 로그인이 막혀 있어 SSH 키로만 들어올 수 있어요' }}
