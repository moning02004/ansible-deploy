common_timezone: Asia/Seoul    # 목록: timedatectl list-timezones
common_hostname: ""            # host_vars에서 지정. 비우면 변경하지 않음
common_apt_upgrade: false      # true면 설치된 패키지 safe upgrade
# 기본으로 설치할 패키지. 통째로 바뀜(기본 항목도 같이 적기)
common_packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - vim
  - htop
  - jq
  - unzip
  - make              # wharfline 등 서버의 Makefile 명령(make up, make backup)용
  - tzdata
  - iproute2          # ansible_default_ipv4 수집에 필요 (최소 이미지에는 없음)
  - ufw               # traefik/gitea 등이 포트 규칙을 미리 등록. 켜는 건 08-security (firewall role)
