- name: Check supported OS
  ansible.builtin.assert:
    that: ansible_os_family == "Debian"
    fail_msg: "Ubuntu/Debian 계열만 지원합니다 (현재: {{ ansible_distribution }})"
    quiet: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe
  when: common_apt_upgrade | bool

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# community.general.timezone(hwclock 필요), timedatectl(dbus 필요)은 최소 이미지에서 실패
# → Debian 표준 방식으로 직접 설정
- name: Set timezone (/etc/localtime)
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ common_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Set timezone (/etc/timezone)
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ common_timezone }}\n"
    mode: "0644"

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
  when: common_hostname | length > 0
