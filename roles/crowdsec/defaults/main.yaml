# 서비스 디렉터리의 부모. 각 서비스는 <service_root>/<이름> (예전 기본값 /opt 에 있던 것은 처음 실행 때 옮김)
service_root: /srv
crowdsec_version: "v1.8.2"                 # https://hub.docker.com/r/crowdsecurity/crowdsec
crowdsec_dir: "{{ service_root | default('/srv') }}/crowdsec"   # service_root 기본 /srv. 예전 기본값 /opt/crowdsec 에 있으면 처음 실행 때 옮김
crowdsec_lapi_port: 8180                   # 127.0.0.1 에만 (호스트의 방화벽 차단기가 접속). 8080 은 wharfline 과 겹침
# 탐지 규칙 묶음. 통째로 바뀜(기본 항목도 같이 적기)
#   찾기: https://app.crowdsec.net/hub/collections   추천 조합/주의: docs/variables.md
crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/sshd
  - crowdsecurity/traefik                   # 03/04/05/07 의 Traefik 액세스 로그
  - crowdsecurity/http-cve
  - crowdsecurity/base-http-scenarios
# 읽을 로그 (호스트 /var/log 를 /var/log/host 로 마운트). type 은 파서 종류: syslog, traefik, nginx ...
crowdsec_acquisitions:
  - { path: /var/log/host/auth.log, type: syslog }
  - { path: /var/log/host/traefik/access.log, type: traefik }
# 차단하지 않을 관리자 IP / CIDR
#   [vpn] 그룹(12-vpn) 서버는 VPN 대역과 WireGuard 컨테이너 네트워크를 자동으로 포함
#   (VPN 을 거친 요청이 한 주소로 보여, 한 명이 걸리면 VPN 사용자 전체가 차단되는 것을 막음)
crowdsec_whitelist_vpn: "{{ inventory_hostname in groups.get('vpn', []) }}"
crowdsec_vpn_ranges:
  - "{{ vpn_subnet | default('10.13.13.0') }}/24"
  - "{{ vpn_docker_subnet | default('172.31.250.0/24') }}"
# 관리자 IP / 대역: CrowdSec 이 차단하지 않음. 예) [203.0.113.10, 198.51.100.0/24]
security_whitelist_ips: []
crowdsec_whitelist: >-
  {{ (security_whitelist_ips | default([]))
     + (crowdsec_vpn_ranges if crowdsec_whitelist_vpn | bool else []) }}
# CrowdSec 콘솔(app.crowdsec.net) 연결 키. 비우면 연결하지 않음
crowdsec_enroll_key: ""
# 방화벽 차단기 (호스트 패키지: iptables 를 직접 다뤄야 해서 컨테이너로 두지 않음)
crowdsec_bouncer_chains: [INPUT, DOCKER-USER]   # DOCKER-USER: Docker 로 연 포트도 차단
crowdsec_bouncer_key: ""                    # 비우면 서버에서 한 번 만들어 <crowdsec_dir>/.env 에 보관
