- name: Remove conflicting distro packages
  ansible.builtin.apt:
    name: [docker.io, docker-doc, docker-compose, docker-compose-v2, podman-docker, containerd, runc]
    state: absent

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  vars:
    docker_apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}.get(ansible_architecture, ansible_architecture) }}"

- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages + ['python3-docker'] }}"   # python3-docker: community.docker 모듈용
    state: present
    update_cache: true

- name: Configure daemon.json (log rotation)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_base | combine(docker_daemon_options, recursive=True) | to_nice_json }}\n"
    mode: "0644"
  vars:
    docker_daemon_base:
      log-driver: json-file
      log-opts:
        max-size: "{{ docker_log_max_size }}"
        max-file: "{{ docker_log_max_file }}"
  notify: Restart docker

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Apply pending handlers
  ansible.builtin.meta: flush_handlers
