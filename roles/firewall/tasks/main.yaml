- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# 잠김 방지: 활성화 전에 SSH부터 허용
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port | string }}"
    proto: tcp
    comment: ssh

- name: Allow public TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Allow source-restricted rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from }}"
  loop: "{{ firewall_rules }}"

- name: Default policy (deny incoming / allow outgoing)
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: firewall_enabled | bool
