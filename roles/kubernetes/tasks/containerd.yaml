# Docker 가 설치한 containerd.io 는 CRI 플러그인이 꺼져 있음 → 기본 설정 + SystemdCgroup 으로 교체
# Docker(namespace moby) 와 Kubernetes(namespace k8s.io) 가 같은 containerd 를 나눠 씀
- name: Render containerd default config
  ansible.builtin.command: containerd config default
  register: containerd_default
  changed_when: false
  check_mode: false

- name: Ensure default config has runc SystemdCgroup option
  ansible.builtin.assert:
    that: containerd_default.stdout is search('SystemdCgroup = false')
    fail_msg: "containerd 기본 설정에서 SystemdCgroup 항목을 찾지 못했습니다 (containerd 버전 확인 필요)"
    quiet: true

- name: Write /etc/containerd/config.toml (CRI on, systemd cgroup)
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: |
      # Ansible 관리 파일 — 직접 수정하지 마세요 (Docker + Kubernetes 공용)
      {{ containerd_default.stdout | replace('SystemdCgroup = false', 'SystemdCgroup = true') }}
    mode: "0644"
  notify: Restart containerd

- name: crictl uses containerd
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
    mode: "0644"

- name: Apply containerd config now
  ansible.builtin.meta: flush_handlers
