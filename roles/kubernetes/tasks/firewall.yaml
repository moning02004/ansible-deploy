# Pod → 노드(API 서버, kubelet, DNS 등) 통신 허용. 없으면 ufw 기본 deny 에 막힘
- name: Allow traffic from Pod network
  community.general.ufw:
    rule: allow
    from_ip: "{{ k8s_pod_subnet }}"
    comment: k8s-pods

- name: Allow Kubernetes API from allowed sources
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    from_ip: "{{ item }}"
    comment: k8s-api
  loop: "{{ k8s_api_allowed_sources }}"

- name: Allow ingress HTTP/HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
    comment: k8s-ingress
  loop: ["{{ k8s_ingress_http_port }}", "{{ k8s_ingress_https_port }}"]
  when: k8s_ingress_enabled | bool
