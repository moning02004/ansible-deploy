- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: k8s_disable_swap | bool and ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
  when: k8s_disable_swap | bool

- name: Load kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: "overlay\nbr_netfilter\n"
    mode: "0644"
  when: k8s_load_kernel_modules | bool

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]
  when: k8s_load_kernel_modules | bool

- name: Kernel parameters for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
