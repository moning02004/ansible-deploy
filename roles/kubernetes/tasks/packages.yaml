- name: Add Kubernetes apt key
  ansible.builtin.shell: >-
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key
    | gpg --dearmor -o /etc/apt/keyrings/kubernetes-v{{ k8s_minor }}.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-v{{ k8s_minor }}.gpg

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-v{{ k8s_minor }}.gpg]
      https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /
    filename: kubernetes
    state: present

- name: Install kubelet / kubeadm / kubectl {{ k8s_version }}
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_version }}-*"
      - "kubeadm={{ k8s_version }}-*"
      - "kubectl={{ k8s_version }}-*"
      - cri-tools                       # crictl (etcd 백업, 디버깅)
      - bash-completion
    state: present
    update_cache: true
    allow_change_held_packages: true   # k8s_version 을 올릴 때 hold 를 풀고 설치

- name: Hold Kubernetes packages (apt upgrade 로 올라가지 않게)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
