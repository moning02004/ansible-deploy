# 서비스 디렉터리의 부모. 각 서비스는 <service_root>/<이름> (예전 기본값 /opt 에 있던 것은 처음 실행 때 옮김)
service_root: /srv
prometheus_version: "v3.16.0"        # https://hub.docker.com/r/prom/prometheus
grafana_version: "13.3.1"            # https://hub.docker.com/r/grafana/grafana
monitoring_dir: "{{ service_root | default('/srv') }}/monitoring"   # service_root 기본 /srv. 예전 기본값 /opt/monitoring 에 있으면 처음 실행 때 옮김
prometheus_port: 9090                # 127.0.0.1 에만
prometheus_retention: 15d             # 단위 h d w y. 예) 30d, 1y
prometheus_scrape_interval: 30s
alertmanager_version: "v0.35.0"      # https://hub.docker.com/r/prom/alertmanager
alertmanager_port: 9093              # 127.0.0.1 에만
# 알림 채널 (값을 넣은 곳으로 보냄. 모두 비우면 Alertmanager 화면에서만 확인)
alert_slack_webhook_url: ""
alert_slack_channel: "#alerts"
alert_telegram_bot_token: ""
alert_telegram_chat_id: 0
alert_webhook_url: ""                # 임의의 웹훅 (예: 사내 메신저 연동)
# 경보 기준
alert_disk_free_percent: 15
alert_memory_used_percent: 90
alert_load_per_core: 2
grafana_port: 3001                   # Traefik 네트워크에서만 접근 허용 (ufw). 3000 은 Gitea 와 겹쳐서 3001
grafana_domain: ""                   # 필수. 예) grafana.example.com
grafana_root_url: "{{ site_scheme | default('http') }}://{{ grafana_domain }}/"
grafana_admin_password: ""           # 필수 (vault). 최초 기동 때만 적용
# 기본 대시보드 (grafana.com ID): Node Exporter Full
#   추천: 14282 (cAdvisor, 컨테이너별), 893 (Docker+시스템). 동작 여부 표: docs/variables.md
grafana_dashboards:
  - { id: 1860, name: node-exporter-full }
# 수집 대상: 그룹 이름 (기본 all)
monitoring_targets: all
