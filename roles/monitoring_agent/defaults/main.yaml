node_exporter_version: "v1.12.1"     # https://hub.docker.com/r/prom/node-exporter
cadvisor_version: "v0.60.6"          # https://github.com/google/cadvisor/releases
monitoring_agent_dir: /opt/monitoring-agent
node_exporter_port: 9100
cadvisor_port: 9280
# 수집을 허용할 IP (기본: [monitoring] 그룹 서버들의 IP)
monitoring_server_ips: >-
  {{ groups['monitoring'] | default([])
     | map('extract', hostvars, ['ansible_default_ipv4', 'address'])
     | select('defined') | list }}
