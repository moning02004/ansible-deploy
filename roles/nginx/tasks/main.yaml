- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Create ACME webroot
  ansible.builtin.file:
    path: /var/www/certbot
    state: directory
    mode: "0755"

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Allow HTTP/HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: Start and enable nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Render sites
  ansible.builtin.include_tasks: sites.yaml

- name: Issue certificates
  when: nginx_certbot_email | length > 0
  block:
    - name: Install certbot
      ansible.builtin.apt:
        name: certbot
        state: present

    - name: Apply HTTP sites before ACME challenge
      ansible.builtin.meta: flush_handlers

    - name: Request certificates (webroot)
      ansible.builtin.command: >-
        certbot certonly --webroot -w /var/www/certbot
        -d {{ item.server_name }} --email {{ nginx_certbot_email }}
        --agree-tos --non-interactive
      args:
        creates: "/etc/letsencrypt/live/{{ item.server_name }}/fullchain.pem"
      loop: "{{ nginx_sites }}"
      loop_control:
        label: "{{ item.server_name }}"

    - name: Reload nginx after renewal
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        content: "#!/bin/sh\nsystemctl reload nginx\n"
        mode: "0755"

    - name: Re-render sites with TLS
      ansible.builtin.include_tasks: sites.yaml
