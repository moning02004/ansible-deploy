- name: Check certificates
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item.server_name }}/fullchain.pem"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.server_name }}"
  register: nginx_cert_stat

- name: Render site configs
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.item.name }}.conf"
    mode: "0644"
  vars:
    site: "{{ item.item }}"
    tls: "{{ item.stat.exists }}"
  loop: "{{ nginx_cert_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  notify: Reload nginx

- name: Enable sites
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item.name }}.conf"
    state: link
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload nginx
