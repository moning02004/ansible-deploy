- name: "postgres | terminate connections"
  ansible.builtin.command: >-
    docker exec postgres psql -U postgres -tAc
    "SELECT count(pg_terminate_backend(pid)) FROM pg_stat_activity WHERE pid <> pg_backend_pid() AND backend_type = 'client backend'"

- name: "postgres | restore pg_dumpall (drop & recreate databases)"
  ansible.builtin.shell: |
    set -o pipefail
    gunzip -c "{{ src }}/postgres-all.sql.gz" | docker exec -i postgres psql -U postgres -d postgres -q -X 2>&1 \
      | grep -vE 'current user cannot be dropped|role "postgres" already exists' || true
  args:
    executable: /bin/bash
  register: pg_restore_out

- name: "postgres | restore output"
  ansible.builtin.debug:
    msg: "{{ pg_restore_out.stdout_lines | select('search', 'ERROR') | list }}"
