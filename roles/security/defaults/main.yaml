security_ssh_port: "{{ ansible_port | default(22) }}"
security_permit_root_login: "no"
# true: 비밀번호 로그인 차단. deploy_user_ssh_keys 가 있어야 하고, 인벤토리도 키 접속이어야 함
security_disable_password_auth: false
security_ssh_allow_users: []          # 비우면 제한 없음. 예) [manager, ubuntu]


security_unattended_upgrades: true    # 보안 업데이트 자동 설치
security_auto_reboot: false           # 커널 업데이트 후 자동 재부팅
security_auto_reboot_time: "04:00"
