- name: Guard against SSH lockout
  ansible.builtin.assert:
    that:
      - not security_disable_password_auth or (deploy_user_ssh_keys | default([]) | length > 0)
      - security_permit_root_login != 'no' or (ansible_user | default('')) != 'root'
    fail_msg: >-
      SSH 잠김 위험: 비밀번호 로그인을 막으려면 deploy_user_ssh_keys 가 있어야 하고,
      root 로그인을 막으려면 Ansible 이 root 가 아닌 계정으로 접속해야 합니다.
    quiet: true

# ---------- SSH ----------
- name: Install packages
  ansible.builtin.apt:
    name: [openssh-server, fail2ban, python3-systemd, unattended-upgrades]
    state: present

- name: Ensure privilege separation dir (for sshd -t)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

- name: SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Validate full sshd config
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

# ---------- fail2ban ----------
- name: fail2ban config
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# ---------- unattended-upgrades ----------
- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "{{ '1' if security_unattended_upgrades else '0' }}";
      APT::Periodic::Unattended-Upgrade "{{ '1' if security_unattended_upgrades else '0' }}";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

- name: Reboot policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      // Ansible 관리 파일 — 직접 수정하지 마세요
      Unattended-Upgrade::Automatic-Reboot "{{ security_auto_reboot | string | lower }}";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ security_auto_reboot_time }}";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
    mode: "0644"

- name: Apply restarts now
  ansible.builtin.meta: flush_handlers
