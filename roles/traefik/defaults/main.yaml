traefik_version: "v3.7.19"          # https://hub.docker.com/_/traefik
traefik_dir: /opt/traefik
traefik_network: web                # 라우팅할 컨테이너가 붙는 외부 네트워크
traefik_acme_email: ""              # 지정하면 Let's Encrypt 자동 HTTPS (HTTP → HTTPS 리다이렉트)
traefik_log_level: INFO
# 액세스 로그: /var/log/traefik/access.log (CrowdSec 이 읽어서 HTTP 공격 탐지)
traefik_access_log: true
# 큰 git push / 업로드가 끊기지 않도록 요청 읽기 시간 제한 해제 (Traefik v3 기본 60s)
traefik_read_timeout: "0s"
# 컨테이너가 아닌 호스트 서비스로 보낼 라우트 (예: host 네트워크로 뜬 Grafana)
#   - { name: grafana, host: grafana.example.com, url: "http://host.docker.internal:3001" }
traefik_file_routes: []
