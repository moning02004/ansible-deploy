- name: Create traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop: ["{{ traefik_dir }}", "{{ traefik_dir }}/dynamic"]

- name: Create access log directory
  ansible.builtin.file:
    path: /var/log/traefik
    state: directory
    mode: "0755"
  when: traefik_access_log | bool

- name: Rotate access log daily (keep 14)
  ansible.builtin.copy:
    dest: /etc/logrotate.d/traefik
    content: |
      /var/log/traefik/*.log {
        daily
        rotate 14
        compress
        delaycompress
        missingok
        notifempty
        copytruncate
      }
    mode: "0644"
  when: traefik_access_log | bool

- name: Create shared network for routed containers
  community.docker.docker_network:
    name: "{{ item }}"
  loop: "{{ [traefik_network] + traefik_extra_networks }}"

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Write file routes (host services)
  ansible.builtin.template:
    src: routes.yml.j2
    dest: "{{ traefik_dir }}/dynamic/routes.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Allow HTTP/HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: Start traefik
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
    wait: true
    wait_timeout: 120
