# 서비스 디렉터리의 부모. 각 서비스는 <service_root>/<이름> (예전 기본값 /opt 에 있던 것은 처음 실행 때 옮김)
service_root: /srv
wireguard_version: "1.0.20260223-r0-ls130"   # https://hub.docker.com/r/linuxserver/wireguard
wireguard_dir: "{{ service_root | default('/srv') }}/wireguard"   # service_root 기본 /srv. 예전 기본값 /opt/wireguard 에 있으면 처음 실행 때 옮김
vpn_server_url: auto                 # 클라이언트가 접속할 주소 (도메인/공인 IP). auto: 공인 IP 자동 감지
vpn_port: 51820                      # UDP
vpn_peers: [laptop]                  # 접속할 사람/기기 이름 (영문, 숫자)
vpn_subnet: 10.13.13.0               # VPN 내부 대역 (/24)
# WireGuard 컨테이너의 Docker 네트워크 (고정해야 CrowdSec 화이트리스트에 넣을 수 있음)
vpn_docker_subnet: 172.31.250.0/24
# 클라이언트가 VPN 으로 보낼 대역. 기본은 VPN 대역만(split tunnel). 전체 트래픽: 0.0.0.0/0
vpn_allowed_ips: "10.13.13.0/24"
vpn_peer_dns: auto                   # auto 또는 1.1.1.1 같은 DNS 주소
vpn_fetch_dir: "{{ playbook_dir }}/secrets/{{ inventory_hostname }}/wireguard"
