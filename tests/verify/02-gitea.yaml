# 02-gitea 결과 점검 (01-base 점검 포함)
- import_playbook: 01-base.yaml

- name: "verify | 02 gitea"
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: nginx config is valid
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Gitea responds through nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/api/healthz
        headers: { Host: "{{ gitea_domain }}" }

    - name: Gitea admin can log in via API
      ansible.builtin.uri:
        url: http://127.0.0.1/api/v1/user
        headers: { Host: "{{ gitea_domain }}" }
        user: "{{ gitea_admin_user | default('gitea_admin') }}"
        password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: me
      failed_when: me.json.is_admin is not true

    - name: Gitea ROOT_URL matches domain
      ansible.builtin.command: docker exec gitea grep -E '^ROOT_URL' /data/gitea/conf/app.ini
      register: rooturl
      changed_when: false
      failed_when: "'http://' ~ gitea_domain ~ '/' not in rooturl.stdout"

    - name: Gitea SSH port is listening
      ansible.builtin.wait_for:
        port: "{{ gitea_ssh_port | default(2222) }}"
        timeout: 10

    - name: runner is registered
      ansible.builtin.command: docker exec gitea-runner cat /data/.runner
      register: runner_file
      changed_when: false
      failed_when: "'uuid' not in runner_file.stdout"

    - name: Runner is online in Gitea
      ansible.builtin.uri:
        url: http://127.0.0.1/api/v1/admin/actions/runners
        headers: { Host: "{{ gitea_domain }}" }
        user: "{{ gitea_admin_user | default('gitea_admin') }}"
        password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: runners
      until: (runners.json.runners | default([]) | selectattr('status', 'equalto', 'online') | list | length) > 0
      retries: 10
      delay: 3

    - name: runner uses latest gitea/runner DinD image without host docker.sock
      ansible.builtin.command: >-
        docker inspect gitea-runner --format
        '{{ "{{" }}.Config.Image{{ "}}" }} {{ "{{" }}.HostConfig.Privileged{{ "}}" }} {{ "{{" }}range .Mounts{{ "}}" }}{{ "{{" }}.Destination{{ "}}" }},{{ "{{" }}end{{ "}}" }}'
      register: runner_inspect
      changed_when: false
      failed_when: >-
        runner_inspect.stdout is not search('docker\.gitea\.com/runner:\S+-dind true') or
        'docker.sock' in runner_inspect.stdout

    - name: Bundled Docker daemon in runner can run containers
      ansible.builtin.command: docker exec gitea-runner docker run --rm alpine:3.22 echo dind-ok
      register: dind_run
      changed_when: false
      failed_when: "'dind-ok' not in dind_run.stdout"
      retries: 10
      delay: 3
      until: dind_run.rc == 0

    - name: Workflow job runs on the runner end-to-end
      vars:
        api: http://127.0.0.1/api/v1
        admin: "{{ gitea_admin_user | default('gitea_admin') }}"
        repo: runner-smoke
        workflow: |
          on: [push]
          jobs:
            smoke:
              runs-on: smoke          # tests/vars.yaml 의 gitea_runner_labels
              steps:
                - run: echo "hello from $(uname -s)"
                  shell: sh
      block:
        - name: Create test repository
          ansible.builtin.uri:
            url: "{{ api }}/user/repos"
            method: POST
            headers: { Host: "{{ gitea_domain }}" }
            user: "{{ admin }}"
            password: "{{ gitea_admin_password }}"
            force_basic_auth: true
            body_format: json
            body: { name: "{{ repo }}", auto_init: true, default_branch: main }
            status_code: [201, 409]

        - name: Push workflow file
          ansible.builtin.uri:
            url: "{{ api }}/repos/{{ admin }}/{{ repo }}/contents/.gitea/workflows/smoke.yaml"
            method: POST
            headers: { Host: "{{ gitea_domain }}" }
            user: "{{ admin }}"
            password: "{{ gitea_admin_password }}"
            force_basic_auth: true
            body_format: json
            body: { content: "{{ workflow | b64encode }}", message: smoke, branch: main }
            status_code: [201, 422]

        - name: Wait for the workflow run to succeed
          ansible.builtin.uri:
            url: "{{ api }}/repos/{{ admin }}/{{ repo }}/actions/runs"
            headers: { Host: "{{ gitea_domain }}" }
            user: "{{ admin }}"
            password: "{{ gitea_admin_password }}"
            force_basic_auth: true
            return_content: true
          register: wf_runs
          until: >-
            (wf_runs.json.workflow_runs | default([]) | length) > 0 and
            wf_runs.json.workflow_runs[0].status == 'completed'
          retries: 60
          delay: 5
          failed_when: >-
            wf_runs.status != 200 or
            ((wf_runs.json.workflow_runs | default([]) | length) > 0 and
             wf_runs.json.workflow_runs[0].status == 'completed' and
             wf_runs.json.workflow_runs[0].conclusion != 'success')

    - name: wharfline responds through nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers: { Host: "{{ wharfline_domain }}" }
        return_content: true
      register: wf
      failed_when: "'<html' not in wf.content | lower"

    - name: wharfline backend is healthy and migrate finished
      ansible.builtin.command: docker compose ps -a --format '{{ "{{" }}.Service{{ "}}" }} {{ "{{" }}.State{{ "}}" }} {{ "{{" }}.Health{{ "}}" }} {{ "{{" }}.ExitCode{{ "}}" }}'
      args:
        chdir: /opt/wharfline
      register: wf_ps
      changed_when: false
      failed_when: >-
        wf_ps.stdout is not search('backend running healthy') or
        wf_ps.stdout is not search('migrate exited\s+0')

    - name: wharfline Owner was created
      ansible.builtin.command: docker compose logs migrate
      args:
        chdir: /opt/wharfline
      register: wf_migrate
      changed_when: false
      failed_when: "'Owner' not in wf_migrate.stdout"

    - name: Secret files are private
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - { path: /opt/gitea/.env,          mode: "0600" }
        - { path: /opt/wharfline/.env,      mode: "0600" }
        - { path: /opt/wharfline/secrets,   mode: "0700" }
      register: perms
      failed_when: perms.stat.mode != item.mode

    - name: Internal services are not exposed on all interfaces
      ansible.builtin.shell: ss -ltnH | awk '{print $4}'
      register: listen
      changed_when: false
      failed_when: >-
        listen.stdout is search('(0\.0\.0\.0|\*|\[::\]):(3000|8080|5432)\b')
