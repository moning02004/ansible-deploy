# 03-gitea 결과 점검 (01-base 점검 포함)
- import_playbook: 01-base.yaml

- name: "verify | 03 gitea"
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Traefik is healthy
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Health.Status{{ "}}" }}' traefik
      register: th
      changed_when: false
      failed_when: th.stdout != 'healthy'

    - name: Traefik access log is written
      ansible.builtin.shell: curl -s -o /dev/null http://127.0.0.1/ && sleep 1 && test -s /var/log/traefik/access.log
      changed_when: false

    - name: Gitea responds through Traefik
      ansible.builtin.uri:
        url: http://127.0.0.1/api/healthz
        headers: { Host: "{{ gitea_domain }}" }

    - name: Gitea admin can log in via API
      ansible.builtin.uri:
        url: http://127.0.0.1/api/v1/user
        headers: { Host: "{{ gitea_domain }}" }
        user: "{{ gitea_admin_user | default('gitea_admin') }}"
        password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: me
      failed_when: me.json.is_admin is not true

    - name: Gitea ROOT_URL matches domain
      ansible.builtin.command: docker exec gitea grep -E '^ROOT_URL' /data/gitea/conf/app.ini
      register: rooturl
      changed_when: false
      failed_when: "'http://' ~ gitea_domain ~ '/' not in rooturl.stdout"

    - name: Gitea SSH port is listening
      ansible.builtin.wait_for:
        port: "{{ gitea_ssh_port | default(2222) }}"
        timeout: 10

    - name: act_runner is registered
      ansible.builtin.command: docker exec gitea-runner cat /data/.runner
      register: runner_file
      changed_when: false
      failed_when: "'uuid' not in runner_file.stdout"

    - name: Runner is online in Gitea
      ansible.builtin.uri:
        url: http://127.0.0.1/api/v1/admin/actions/runners
        headers: { Host: "{{ gitea_domain }}" }
        user: "{{ gitea_admin_user | default('gitea_admin') }}"
        password: "{{ gitea_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: runners
      until: (runners.json.runners | default([]) | selectattr('status', 'equalto', 'online') | list | length) > 0
      retries: 10
      delay: 3

    - name: wharfline responds through Traefik
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers: { Host: "{{ wharfline_domain }}" }
        return_content: true
      register: wf
      failed_when: "'<html' not in wf.content | lower"

    - name: wharfline backend is healthy and migrate finished
      ansible.builtin.command: docker compose ps -a --format '{{ "{{" }}.Service{{ "}}" }} {{ "{{" }}.State{{ "}}" }} {{ "{{" }}.Health{{ "}}" }} {{ "{{" }}.ExitCode{{ "}}" }}'
      args:
        chdir: /opt/wharfline
      register: wf_ps
      changed_when: false
      failed_when: >-
        wf_ps.stdout is not search('backend running healthy') or
        wf_ps.stdout is not search('migrate exited\s+0')

    - name: Workflow job network reaches the site domains through Traefik
      ansible.builtin.command: >-
        docker run --rm --network {{ gitea_runner_network | default('gitea_actions') }} alpine:3.20
        sh -c 'wget -qO- http://{{ gitea_domain }}/api/healthz && wget -qO- http://{{ wharfline_domain }}/ | grep -qi "<html"'
      changed_when: false

    - name: wharfline backend reaches Gitea at WHARFLINE_GITEA_URL (the domain)
      ansible.builtin.command: >-
        docker compose exec -T backend python -c
        "import os, urllib.request; u = os.environ['WHARFLINE_GITEA_URL']; assert '{{ gitea_domain }}' in u, u;
        urllib.request.urlopen(u + '/api/healthz', timeout=10)"
      args:
        chdir: /opt/wharfline
      changed_when: false

    - name: Traefik keeps the registered domains
      ansible.builtin.command: cat /opt/traefik/aliases.json
      register: aliases
      changed_when: false
      failed_when: >-
        gitea_domain not in (aliases.stdout | from_json).aliases or
        wharfline_domain not in (aliases.stdout | from_json).aliases

    - name: wharfline Owner was created
      ansible.builtin.command: docker compose logs migrate
      args:
        chdir: /opt/wharfline
      register: wf_migrate
      changed_when: false
      failed_when: "'Owner' not in wf_migrate.stdout"

    - name: Secret files are private
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - { path: /opt/gitea/.env,          mode: "0600" }
        - { path: /opt/wharfline/.env,      mode: "0600" }
        - { path: /opt/wharfline/secrets,   mode: "0700" }
      register: perms
      failed_when: perms.stat.mode != item.mode

    - name: Internal services are not exposed on all interfaces
      ansible.builtin.shell: ss -ltnH | awk '{print $4}'
      register: listen
      changed_when: false
      failed_when: >-
        listen.stdout is search('(0\.0\.0\.0|\*|\[::\]):(3000|8080|5432)\b')
