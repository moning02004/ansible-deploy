# 07-monitoring 결과 점검 (01-base 점검 포함)
- import_playbook: 01-base.yaml

- name: "verify | 07 monitoring"
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: All Prometheus targets are up
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/targets
        return_content: true
      register: targets
      until: >-
        (targets.json.data.activeTargets | length) >= 3 and
        (targets.json.data.activeTargets | rejectattr('health', 'equalto', 'up') | list | length) == 0
      retries: 20
      delay: 5

    - name: node and cadvisor metrics are collected
      ansible.builtin.uri:
        url: "http://127.0.0.1:9090/api/v1/query?query={{ item | urlencode }}"
        return_content: true
      register: q
      failed_when: q.json.data.result | length == 0
      loop:
        - node_load1
        - container_last_seen

    - name: Grafana is healthy through Traefik
      ansible.builtin.uri:
        url: http://127.0.0.1/api/health
        headers: { Host: "{{ grafana_domain }}" }
        return_content: true
      register: gh
      failed_when: gh.json.database != 'ok'

    - name: Grafana has Prometheus datasource and dashboard
      ansible.builtin.uri:
        url: "http://127.0.0.1/api/{{ item.path }}"
        headers: { Host: "{{ grafana_domain }}" }
        user: admin
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        return_content: true
      register: gapi
      failed_when: item.expect not in gapi.content
      loop:
        - { path: "datasources/uid/prometheus/health", expect: '"status":"OK"' }
        - { path: "search?query=Node", expect: "Node Exporter Full" }

    - name: Prometheus listens on localhost only
      ansible.builtin.shell: ss -ltnH | awk '{print $4}'
      register: listen
      changed_when: false
      failed_when: listen.stdout is search('(0\.0\.0\.0|\*|\[::\]):9090\b')

    - name: Exporter and Grafana ports are blocked for outside clients
      ansible.builtin.command: docker run --rm busybox:1.37 nc -z -w 3 {{ ansible_default_ipv4.address }} {{ item }}
      delegate_to: localhost
      become: false
      register: ext
      changed_when: false
      failed_when: ext.rc == 0
      loop: [9100, 9280, 3001]   # exporter + Grafana 직접 접근 차단

    - name: Alert rules are loaded
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/rules
        return_content: true
      register: rules
      failed_when: >-
        rules.json.data.groups | map(attribute='rules') | flatten | map(attribute='name') | list
        | intersect(['InstanceDown', 'DiskSpaceLow', 'HighMemoryUsage', 'HighLoad', 'ContainerRestarting']) | length != 5

    - name: Prometheus is connected to Alertmanager
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/alertmanagers
        return_content: true
      register: ams
      until: ams.json.data.activeAlertmanagers | length > 0
      retries: 10
      delay: 3

    - name: Alertmanager accepts and lists an alert
      ansible.builtin.shell: |
        curl -sf -XPOST -H 'Content-Type: application/json' http://127.0.0.1:9093/api/v2/alerts \
          -d '[{"labels":{"alertname":"VerifyAlert","severity":"warning","instance":"testhost"},"annotations":{"summary":"verify"}}]'
        sleep 2
        curl -sf http://127.0.0.1:9093/api/v2/alerts
      register: am
      changed_when: false
      failed_when: "'VerifyAlert' not in am.stdout"

    - name: Alertmanager listens on localhost only
      ansible.builtin.shell: ss -ltnH | awk '{print $4}'
      register: amlisten
      changed_when: false
      failed_when: amlisten.stdout is search('(0\.0\.0\.0|\*|\[::\]):9093\b')
